spring:
  config:
    import: optional:file:.env[.properties]

  profiles:
    active: ${APP_PROFILE:dev}

  jpa:
    open-in-view: false

security:
  client-id: ${CLIENT_ID}
  client-secret: ${CLIENT_SECRET}
  jwt:
    duration: ${JWT_DURATION}
    private-key-base64: ${JWT_PRIVATE_KEY_BASE64}
    public-key-base64: ${JWT_PUBLIC_KEY_BASE64}

cors:
  origins: ${CORS_ORIGINS}

springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    persist-authorization: true
